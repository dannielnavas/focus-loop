appId: dev.danniel.focus-loop
productName: Focus Loop
# La publicación la hace el job "release" del workflow; no usar la de electron-builder
publish: null
files:
  - out
  - dist
  - package.json
directories:
  output: release

# --- Firma de código (opcional, vía variables de entorno) ---
# Linux: electron-builder no firma AppImage; el workflow puede firmar con GPG (gratis).
# Windows: CSC_LINK + CSC_KEY_PASSWORD (o WIN_CSC_* en Mac/Linux). Certificado auto-firmado
#   gratis: npx electron-builder create-self-signed-cert -p "Tu Nombre"
# macOS: CSC_LINK + CSC_KEY_PASSWORD. Notarización requiere Apple Developer (de pago).

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  artifactName: Focus-Loop-${version}-${arch}.${ext}

win:
  target:
    - nsis
    - portable
  artifactName: Focus-Loop-${version}.${ext}
  # Firma con CSC_LINK/CSC_KEY_PASSWORD o WIN_CSC_* (certificado auto-firmado válido para desarrollo)

linux:
  target:
    - AppImage
  category: Utility
  artifactName: Focus-Loop-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
