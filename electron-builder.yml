appId: dev.danniel.focus-loop
productName: Focus Loop
# La publicación la hace el job "release" del workflow; no usar la de electron-builder
publish: null
files:
  - out
  - dist
  - package.json
directories:
  output: release

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  artifactName: Focus-Loop-${version}-${arch}.${ext}
  icon: build/icons/icon-512.png

win:
  target:
    - nsis
    - portable
  artifactName: Focus-Loop-${version}.${ext}
  icon: build/icons/icon-512.png

linux:
  target:
    - AppImage
  category: Utility
  artifactName: Focus-Loop-${version}-${arch}.${ext}
  icon: build/icons/icon-512.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
