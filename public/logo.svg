<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Degradado del anillo -->
    <linearGradient id="gradRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Degradado del punto central -->
    <radialGradient id="gradCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="1"/>
    </radialGradient>

    <!-- Sombra suave del anillo -->
    <filter id="shadowRing" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo opcional oscuro (puedes quitarlo si quieres transparente) -->
  <rect x="0" y="0" width="256" height="256" rx="64" fill="#020617"/>

  <!-- Anillo principal -->
  <circle
    cx="128"
    cy="128"
    r="84"
    fill="none"
    stroke="url(#gradRing)"
    stroke-width="32"
    stroke-linecap="round"
    filter="url(#shadowRing)"
  />

  <!-- Corte sutil en el anillo para sugerir “loop”/progreso -->
  <path
    d="M 210 128 A 82 82 0 0 0 185 72"
    fill="none"
    stroke="#020617"
    stroke-width="36"
    stroke-linecap="round"
  />

  <!-- Punto central de foco -->
  <circle
    cx="128"
    cy="128"
    r="22"
    fill="url(#gradCenter)"
  />
</svg>
