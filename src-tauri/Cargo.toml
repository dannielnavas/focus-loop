[package]
name = "focus-loop"
version = "0.0.2"
description = "Focus Loop"
authors = ["Danniel Navas"]
edition = "2021"

[lib]
name = "focus_loop"
path = "src/lib.rs"

[[bin]]
name = "focus-loop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
