<section
  class="flex flex-col sm:flex-row items-center justify-center w-full min-h-[100dvh] h-full mx-auto gap-4 px-2 bg-white dark:bg-dark"
>
  <div
    class="group flex items-center gap-4 rounded-xl border border-gray-200 dark:border-dark-border bg-white dark:bg-dark-elevated p-2 shadow-sm hover:border-gray-300 dark:hover:border-dark-border-hover transition-all duration-200 w-full relative min-h-[60px]"
  >
    <div class="flex items-center justify-between w-full gap-4 px-4">
      <div class="flex items-center flex-1 min-w-0">
        <p class="text-gray-900 dark:text-dark-text font-semibold text-base truncate">
          {{ task()?.title }}
        </p>
      </div>
      <div class="flex items-center text-base text-gray-600 dark:text-dark-text-muted flex-shrink-0 tabular-nums">
        {{ formatTime((timerState()?.minutes ?? 0) * 60 + (timerState()?.seconds ?? 0)) }}
      </div>
    </div>

    <div
      class="items-center gap-2 absolute top-0 left-0 right-0 h-full hidden group-hover:flex justify-center bg-white/95 dark:bg-dark-elevated/98 backdrop-blur rounded-xl z-10 border border-gray-200 dark:border-dark-border w-full"
    >
      <app-ui-button
        variant="ghost"
        size="sm"
        class="!p-2"
        title="Back"
        (click)="backToWork()"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </app-ui-button>

      @if (!timerState()?.status) {
        <app-ui-button variant="primary" size="sm" class="!p-2" title="Start" (click)="start()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347c-.75.412-1.667-.13-1.667-.986V5.653Z" />
          </svg>
        </app-ui-button>
      } @else {
        <app-ui-button
          variant="primary"
          size="sm"
          class="!p-2"
          title="Pause / Resume"
          (click)="status() ? pause() : play()"
        >
          @if (status()) {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6" />
            </svg>
          } @else {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347c-.75.412-1.667-.13-1.667-.986V5.653Z" />
            </svg>
          }
        </app-ui-button>
      }

      <app-ui-button
        variant="secondary"
        size="sm"
        class="!p-2"
        title="Finish task"
        (click)="goToNextTask()"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </app-ui-button>
    </div>
  </div>
</section>
