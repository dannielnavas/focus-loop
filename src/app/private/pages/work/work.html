<div class="work-page">
  <div class="work-atmosphere" aria-hidden="true"></div>
  <app-header [countTasks]="today().length" />

  <div class="work-inner">
    <!-- La banda va debajo del header fijo (.work-inner tiene padding-top) -->
    <div class="work-header-band">
      <h1 class="work-title">En foco</h1>
      <p class="work-sub">Arrastra para priorizar. Listo cuando tú lo estés.</p>
    </div>

    <div class="work-shell rounded-2xl overflow-hidden flex flex-col shadow-sm work-shell-edge">
      <div
        cdkDropList
        (cdkDropListDropped)="drop($event)"
        class="work-list work-list--scroll flex-1 overflow-y-auto px-3 sm:px-4"
        role="list"
        [attr.aria-label]="'Tareas de hoy, ' + today().length + ' elementos'"
      >
        @for (item of today(); track item.task_id; let i = $index) {
          <div
            class="work-card group"
            cdkDrag
            [cdkDragData]="item"
            [cdkDragDisabled]="false"
            role="listitem"
          >
            <div class="work-card-gutter" aria-hidden="true"></div>
            <button
              type="button"
              class="work-grip"
              cdkDragHandle
              aria-label="Arrastrar para reordenar"
            >
              <svg class="work-grip-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="9" cy="8" r="1.35" />
                <circle cx="15" cy="8" r="1.35" />
                <circle cx="9" cy="12" r="1.35" />
                <circle cx="15" cy="12" r="1.35" />
                <circle cx="9" cy="16" r="1.35" />
                <circle cx="15" cy="16" r="1.35" />
              </svg>
            </button>
            <div class="work-card-body">
              <p class="work-card-title">{{ item.title }}</p>
              <div class="work-card-actions">
                <app-ui-button
                  variant="primary"
                  size="sm"
                  class="work-btn-done"
                  (click)="markAsCompleted(item.task_id)"
                >
                  Hecho
                </app-ui-button>
                <app-ui-button
                  variant="ghost"
                  size="sm"
                  class="work-btn-delete !p-2"
                  (click)="deleteTask($index)"
                  [attr.aria-label]="'Eliminar ' + item.title"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </app-ui-button>
              </div>
            </div>
          </div>
        }
        @if (today().length === 0) {
          <div class="work-empty" role="status">
            <div class="work-empty-icon-wrap">
              <svg class="work-empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </div>
            <p class="work-empty-title">Canvas en blanco</p>
            <p class="work-empty-text">No hay tareas en curso para hoy. Añade algo desde el tablero o vuelve más tarde.</p>
          </div>
        }
      </div>
    </div>

    <app-ui-button
      variant="primary"
      class="work-zen-cta fixed bottom-7 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md !py-4 z-10 work-zen-glow"
      (click)="startTasks()"
    >
      <span class="flex items-center justify-center gap-2">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        Modo zen
      </span>
    </app-ui-button>
  </div>
</div>
