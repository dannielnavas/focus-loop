<div class="w-full max-w-md mx-auto min-h-screen bg-white dark:bg-dark">
  <div class="max-w-7xl mx-auto relative h-[calc(100vh-88px)] flex flex-col">
    <div class="rounded-xl border border-gray-200 dark:border-dark-border overflow-hidden h-full flex flex-col shadow-sm">
      <app-header [countTasks]="today().length" />
      <div
        cdkDropList
        (cdkDropListDropped)="drop($event)"
        class="flex-1 overflow-y-auto p-3 sm:p-4 bg-white dark:bg-dark"
        style="padding-bottom: 100px"
      >
        @for (item of today(); track item.task_id; let i = $index) {
          <div
            class="rounded-lg border border-gray-200 dark:border-dark-border p-3 sm:p-4 mb-3 cursor-move hover:border-gray-300 dark:hover:border-dark-border-hover transition-all duration-200 bg-white dark:bg-dark-elevated"
            cdkDrag
            [cdkDragData]="item"
            [cdkDragDisabled]="false"
          >
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center flex-1 min-w-0">
                <span class="w-2 h-2 rounded-full bg-gray-400 dark:bg-dark-text-muted shrink-0 mr-3"></span>
                <p class="text-gray-900 dark:text-dark-text font-medium truncate">{{ item.title }}</p>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <app-ui-button
                  variant="primary"
                  size="sm"
                  (click)="markAsCompleted(item.task_id)"
                >
                  Done
                </app-ui-button>
                <app-ui-button
                  variant="ghost"
                  size="sm"
                  class="!p-2 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30"
                  (click)="deleteTask($index)"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </app-ui-button>
              </div>
            </div>
          </div>
        }
        @if (today().length === 0) {
          <div class="text-center text-gray-500 dark:text-dark-text-muted py-8">
            <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <p class="text-sm">No tasks for today</p>
          </div>
        }
      </div>
    </div>

    <app-ui-button
      variant="primary"
      class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md !py-4 z-10"
      (click)="startTasks()"
    >
      <span class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        Activate zen mode
      </span>
    </app-ui-button>
  </div>
</div>
