<main
  class="min-h-screen w-full flex items-center justify-center px-4 py-12 bg-white dark:bg-dark"
>
  <app-ui-card
    variant="default"
    padding="lg"
    class="w-full max-w-md border border-gray-200 dark:border-dark-border"
  >
    <h1
      class="text-center text-2xl sm:text-3xl font-semibold tracking-tight text-gray-900 dark:text-dark-text mb-8"
    >
      Log in
    </h1>

    <form
      [formGroup]="formLogin"
      novalidate
      (ngSubmit)="login()"
      class="flex flex-col gap-6"
    >
      <app-ui-input
        formControlName="email"
        label="Email or Username"
        placeholder="Email or Username"
        [error]="getEmailError()"
      />

      <div class="space-y-1">
        <app-ui-input
          formControlName="password"
          label="Password"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Password"
          [error]="getPasswordError()"
        />
        <button
          type="button"
          class="text-sm text-gray-500 hover:text-gray-900 dark:text-dark-text-muted dark:hover:text-dark-text transition-colors duration-200"
          (click)="togglePasswordVisibility()"
        >
          @if (showPassword()) { Hide password } @else { Show password }
        </button>
      </div>

      @if (errorMessage) {
        <div
          class="rounded-md border border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-950/30 px-3 py-2 text-sm text-red-800 dark:text-red-300"
        >
          {{ errorMessage }}
        </div>
      }

      <app-ui-button
        type="submit"
        variant="primary"
        [disabled]="isLoading"
        class="w-full"
      >
        @if (isLoading) {
          <span class="inline-flex items-center gap-2">
            <svg
              class="animate-spin h-4 w-4"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              />
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              />
            </svg>
            Signing in…
          </span>
        } @else {
          Sign in
        }
      </app-ui-button>
    </form>
  </app-ui-card>
</main>
