<main
  class="min-h-screen w-full flex items-center justify-center px-4 py-12 bg-[#faf7f2] dark:bg-dark relative overflow-hidden login-page-bg"
>
  <!-- Background Glow Orbs -->
  <div class="login-atmosphere" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <app-ui-card
    variant="default"
    padding="lg"
    class="w-full max-w-md border border-gray-200/50 dark:border-dark-border/40 bg-white/70 dark:bg-dark-elevated/65 backdrop-blur-xl shadow-2xl relative z-10 rounded-2xl transition-all duration-300 hover:shadow-purple-500/5 dark:hover:shadow-purple-400/5"
  >
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-purple-500/20 mb-3 rotate-3 hover:rotate-12 transition-transform duration-300">
        FL
      </div>
      <h1
        class="text-center text-2xl sm:text-3xl font-extrabold tracking-tight text-gray-900 dark:text-dark-text font-heading"
      >
        Focus Loop
      </h1>
      <p class="text-xs text-gray-500 dark:text-dark-text-muted mt-1">Inicia sesión para continuar enfocado</p>
    </div>

    <form
      [formGroup]="formLogin"
      novalidate
      (ngSubmit)="login()"
      class="flex flex-col gap-6"
    >
      <app-ui-input
        formControlName="email"
        label="Email o Usuario"
        placeholder="tu@correo.com"
        [error]="getEmailError()"
        class="login-input"
      />

      <div class="space-y-1.5">
        <app-ui-input
          formControlName="password"
          label="Contraseña"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="••••••••"
          [error]="getPasswordError()"
          class="login-input"
        />
        <div class="flex justify-end">
          <button
            type="button"
            class="text-xs font-semibold text-purple-600 hover:text-purple-700 dark:text-purple-400 dark:hover:text-purple-300 transition-colors duration-200"
            (click)="togglePasswordVisibility()"
          >
            @if (showPassword()) { Ocultar contraseña } @else { Mostrar contraseña }
          </button>
        </div>
      </div>

      @if (errorMessage) {
        <div
          class="rounded-lg border border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-950/30 px-3 py-2.5 text-xs text-red-800 dark:text-red-300 flex items-center gap-2"
        >
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          {{ errorMessage }}
        </div>
      }

      <app-ui-button
        type="submit"
        variant="primary"
        [disabled]="isLoading"
        class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 dark:from-purple-500 dark:to-indigo-500 text-white border-0 py-2.5 hover:from-purple-700 hover:to-indigo-700 hover:scale-[1.01] active:scale-[0.99] transition-all duration-200 shadow-md shadow-purple-500/10 dark:shadow-purple-400/10"
      >
        @if (isLoading) {
          <span class="inline-flex items-center gap-2 text-sm">
            <svg
              class="animate-spin h-4 w-4"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              />
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              />
            </svg>
            Ingresando…
          </span>
        } @else {
          Ingresar
        }
      </app-ui-button>
    </form>
  </app-ui-card>
</main>
