<header
  class="w-full border-b border-gray-200/80 dark:border-dark-border bg-white/95 dark:bg-dark/98 backdrop-blur-sm transition-colors duration-200 fixed top-0 left-0 right-0 z-50 pt-[env(safe-area-inset-top,0px)]"
>
  <div class="max-w-7xl mx-auto px-3 sm:px-4 lg:px-6 flex justify-between items-center py-2 min-h-[2.75rem]">
    <div class="flex items-center gap-2 min-w-0 flex-1">
      <app-ui-button
        variant="ghost"
        size="sm"
        class="!p-1.5 shrink-0"
        [ariaLabel]="'Volver'"
        (click)="goToBack()"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"
          />
        </svg>
      </app-ui-button>

      @if (countTasks() > 0) {
        <div class="flex items-center gap-1.5 min-w-0">
          <h2
            class="text-base font-semibold text-gray-900 dark:text-dark-text flex items-center gap-1.5 truncate"
          >
            <svg
              class="w-4 h-4 shrink-0"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            Today
          </h2>
          <p class="text-xs text-gray-500 dark:text-dark-text-muted shrink-0">
            {{ countTasks() }} tasks
          </p>
        </div>
      }
    </div>

    <div class="flex items-center shrink-0">
      <img
        class="w-8 h-8 rounded-full cursor-pointer border border-gray-200 dark:border-dark-border object-cover"
        ngSrc="{{ $image() }}"
        width="32"
        height="32"
        alt="Profile"
        priority
        (click)="goToProfile()"
      />
    </div>
  </div>
</header>

@if (showDaily()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-dark/60"
  >
    <app-ui-card
      variant="elevated"
      padding="md"
      class="max-w-2xl w-full max-h-[80vh] overflow-y-auto bg-white dark:bg-dark-elevated border border-gray-200 dark:border-dark-border shadow-md"
    >
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-dark-text">
          Daily Report
        </h2>
        <app-ui-button variant="ghost" size="sm" (click)="closeDaily()">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </app-ui-button>
      </div>
      <div
        class="rounded-lg p-4 border border-gray-200 dark:border-dark-border bg-gray-50 dark:bg-dark-elevated"
      >
        @if (isLoadingDaily()) {
          <div class="space-y-3">
            @for (i of [1,2,3,4,5,6,7,8]; track i) {
              <app-ui-skeleton
                [width]="i === 2 ? 'w-5/6' : i === 3 ? 'w-4/6' : 'w-full'"
              />
            }
            <div class="flex items-center justify-center gap-2 pt-2 text-gray-500 dark:text-dark-text-muted text-sm">
              <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                />
              </svg>
              <span>Generating report…</span>
            </div>
          </div>
        } @else {
          <pre
            class="text-gray-700 dark:text-dark-text-muted whitespace-pre-wrap font-mono text-sm"
          >{{ dailyContent() }}</pre
          >
        }
      </div>
      <div class="flex justify-end mt-4">
        <app-ui-button variant="secondary" (click)="closeDaily()">
          Close
        </app-ui-button>
      </div>
    </app-ui-card>
  </div>
}
